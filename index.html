<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pocket Windows PC Emulator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f111a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  header { text-align: center; margin-bottom: 20px; }
  h1 { font-size: 1.8rem; font-weight: 700; color: #60a5fa; margin-bottom: 8px; }
  .info { font-size: 0.85rem; color: #94a3b8; margin-bottom: 12px; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    background: #1e293b;
    padding: 12px 20px;
    border-radius: 8px;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
  }
  select, button {
    background: #3b82f6;
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  select { background: #334155; }
  button:hover { background: #2563eb; }
  select:focus, button:focus { outline: 2px solid #60a5fa; }
  .canvas-container {
    position: relative;
    background: #000;
    border: 2px solid #334155;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .status-bar {
    margin-top: 12px;
    font-size: 0.85rem;
    color: #cbd5e1;
  }
</style>
</head>
<body>

<header>
  <h1>Pocket Windows PC Emulator</h1>
  <div class="info" id="sys-info">Hardware Auto-Detection: Logical Cores = 4 | GPU = SwiftShader WebGL</div>
</header>

<div class="controls">
  <label for="ram-select">VM Memory:</label>
  <select id="ram-select">
    <option value="256">256 MB</option>
    <option value="512">512 MB</option>
    <option value="1024" selected>1024 MB (Recommended)</option>
    <option value="2048">2048 MB</option>
  </select>

  <button id="btn-test">Run Built-in Test Disk</button>
  <button id="btn-iso">Choose Custom ISO File</button>
  <input type="file" id="file-iso" accept=".iso,.img" style="display:none">

  <span class="status-bar" id="status">Status: Ready</span>
</div>

<div class="canvas-container" id="container">
  <canvas id="screen" width="720" height="400"></canvas>
</div>

<div id="log-container" style="margin-top: 15px; width: 100%; max-width: 1024px; background: #000; border: 1px solid #334155; border-radius: 6px; padding: 10px; box-shadow: inset 0 0 5px rgba(0,0,0,0.8);">
  <div style="font-size: 0.8rem; font-weight: bold; color: #94a3b8; margin-bottom: 5px;">Bochs Output Console:</div>
  <pre id="log-panel" style="font-family: monospace; font-size: 0.75rem; color: #4ade80; height: 120px; overflow-y: auto; margin: 0; white-space: pre-wrap; word-break: break-all;"></pre>
</div>

<script>
const sysInfoDiv = document.getElementById('sys-info');
const statusDiv = document.getElementById('status');
const canvas = document.getElementById('screen');
const container = document.getElementById('container');
const ctx = canvas.getContext('2d');

const DOM_TO_BX_KEY = {
  "Escape": 0x01, "Digit1": 0x02, "Digit2": 0x03, "Digit4": 0x05, "Digit5": 0x06,
  "Digit6": 0x07, "Digit7": 0x08, "Digit8": 0x09, "Digit9": 0x0a, "Digit0": 0x0b, "Minus": 0x0c,
  "Equal": 0x0d, "Backspace": 0x0e, "Tab": 0x0f, "KeyQ": 0x10, "KeyW": 0x11, "KeyE": 0x12,
  "KeyR": 0x13, "KeyT": 0x14, "KeyY": 0x15, "KeyU": 0x16, "KeyI": 0x17, "KeyO": 0x18,
  "KeyP": 0x19, "BracketLeft": 0x1a, "BracketRight": 0x1b, "Enter": 0x1c, "ControlLeft": 0x1d,
  "KeyA": 0x1e, "KeyS": 0x1f, "KeyD": 0x20, "KeyF": 0x21, "KeyG": 0x22, "KeyH": 0x23,
  "KeyJ": 0x24, "KeyK": 0x25, "KeyL": 0x26, "Semicolon": 0x27, "Quote": 0x28, "Backquote": 0x29,
  "ShiftLeft": 0x2a, "Backslash": 0x2b, "KeyZ": 0x2c, "KeyX": 0x2d, "KeyC": 0x2e, "KeyV": 0x2f,
  "KeyB": 0x30, "KeyN": 0x31, "KeyM": 0x32, "Comma": 0x33, "Period": 0x34, "Slash": 0x35,
  "ShiftRight": 0x36, "NumpadMultiply": 0x37, "AltLeft": 0x38, "Space": 0x39, "CapsLock": 0x3a,
  "F1": 0x3b, "F2": 0x3c, "F3": 0x3d, "F4": 0x3e, "F5": 0x3f, "F6": 0x40, "F7": 0x41,
  "F8": 0x42, "F9": 0x43, "F10": 0x44, "NumLock": 0x45, "ScrollLock": 0x46, "Numpad7": 0x47,
  "Numpad8": 0x48, "Numpad9": 0x49, "NumpadMinus": 0x4a, "Numpad4": 0x4b, "Numpad5": 0x4c,
  "Numpad6": 0x4d, "NumpadPlus": 0x4e, "Numpad1": 0x4f, "Numpad2": 0x50, "Numpad3": 0x51,
  "Numpad0": 0x52, "NumpadDecimal": 0x53, "F11": 0x57, "F12": 0x58, "ArrowUp": 0xe048,
  "ArrowDown": 0xe050, "ArrowLeft": 0xe04b, "ArrowRight": 0xe04d, "Delete": 0xe053
};

let worker = new Worker('worker.js');
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 22050 });
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

worker.onmessage = function(e) {
  if (!e || !e.data) return;
  const msg = e.data;
  if (msg.type === 'frame') {
    if (canvas.width !== msg.width || canvas.height !== msg.height) {
      canvas.width = msg.width;
      canvas.height = msg.height;
      scaleCanvas();
    }
    if (msg.dirtyW > 0 && msg.dirtyH > 0) {
      ctx.putImageData(msg.imageData, 0, 0, msg.dirtyX, msg.dirtyY, msg.dirtyW, msg.dirtyH);
    } else {
      ctx.putImageData(msg.imageData, 0, 0);
    }
    window.frameRendered = true;
    statusDiv.innerText = 'Status: Emulator Running';
  } else if (msg.type === 'dimension') {
    canvas.width = msg.width;
    canvas.height = msg.height;
    scaleCanvas();
  } else if (msg.type === 'audio') {
    initAudio();
  } else if (msg.type === 'log') {
    console.log('[Worker]', msg.text);
    const logPanel = document.getElementById('log-panel');
    if (logPanel) {
      logPanel.textContent += msg.text + '\n';
      logPanel.scrollTop = logPanel.scrollHeight;
    }
  } else if (msg.type === 'error') {
    statusDiv.innerText = 'Error: ' + msg.message;
  }
};

function scaleCanvas() {
  const maxW = Math.min(window.innerWidth - 40, 1024);
  const ratio = Math.max(1, Math.floor(maxW / canvas.width));
  canvas.style.width = `${canvas.width * ratio}px`;
  canvas.style.height = `${canvas.height * ratio}px`;
}
window.addEventListener('resize', scaleCanvas);

window.addEventListener('keydown', (e) => {
  initAudio();
  const bxKey = DOM_TO_BX_KEY[e.code];
  if (bxKey !== undefined) {
    worker.postMessage({ type: 'keydown', key: bxKey, scancode: bxKey });
    e.preventDefault();
  }
});

window.addEventListener('keyup', (e) => {
  const bxKey = DOM_TO_BX_KEY[e.code];
  if (bxKey !== undefined) {
    worker.postMessage({ type: 'keyup', key: bxKey, scancode: bxKey });
    e.preventDefault();
  }
});

let mouseButtons = 0;
canvas.addEventListener('mousedown', (e) => {
  canvas.requestPointerLock();
  initAudio();
  mouseButtons |= (1 << e.button);
  worker.postMessage({ type: 'mouse', x: 0, y: 0, buttonState: mouseButtons, buttons: mouseButtons });
});

canvas.addEventListener('mouseup', (e) => {
  mouseButtons &= ~(1 << e.button);
  worker.postMessage({ type: 'mouse', x: 0, y: 0, buttonState: mouseButtons, buttons: mouseButtons });
});

window.addEventListener('mousemove', (e) => {
  if (document.pointerLockElement === canvas) {
    worker.postMessage({ type: 'mouse', x: e.movementX, y: e.movementY, buttonState: mouseButtons, buttons: mouseButtons, deltaX: e.movementX, deltaY: e.movementY });
  }
});

function createTestHddImage() {
  const size = 10 * 1024 * 1024;
  const buffer = new ArrayBuffer(size);
  const u8 = new Uint8Array(buffer);

  const mbrCode = [
    0xFA, 0x31, 0xC0, 0x8E, 0xD8, 0x8E, 0xC0, 0x8E, 0xD0, 0xBC,
    0x00, 0x7C, 0xFB, 0xBE, 0x1A, 0x7C, 0xAC, 0x08, 0xC0, 0x74,
    0x09, 0xB4, 0x0E, 0xBB, 0x07, 0x00, 0xCD, 0x10, 0xEB, 0xF2,
    0xF4, 0xEB, 0xFD
  ];

  for (let i = 0; i < mbrCode.length; i++) {
    u8[i] = mbrCode[i];
  }

  const msgStr = "Pocket Windows WASM Bochs PC Booted Successfully!\r\nBooting from Hard Disk...\r\n";
  for (let i = 0; i < msgStr.length; i++) {
    u8[0x1A + i] = msgStr.charCodeAt(i);
  }

  u8[510] = 0x55;
  u8[511] = 0xAA;

  return buffer;
}

async function boot(isoFileOrBlob, bootOrder = 'cdrom') {
  statusDiv.innerText = 'Status: Fetching BIOS & ROMs...';
  const biosRes = await fetch('BIOS-bochs-latest');
  const biosBytes = await biosRes.arrayBuffer();

  const vgabiosRes = await fetch('VGABIOS-lgpl-latest');
  const vgabiosBytes = await vgabiosRes.arrayBuffer();

  const hddBytes = createTestHddImage();
  const ramMegs = document.getElementById('ram-select').value;

  statusDiv.innerText = 'Status: Emulator Running';

  // Send File or Blob directly to worker for WORKERFS mounting
  worker.postMessage({
    type: 'init',
    isoFile: isoFileOrBlob,
    hddBytes: hddBytes,
    biosBytes: biosBytes,
    vgabiosBytes: vgabiosBytes,
    ramMegs: ramMegs,
    bootOrder: bootOrder
  });
}

document.getElementById('btn-test').addEventListener('click', () => {
  const dummyIsoBlob = new Blob([new Uint8Array(2048)]);
  boot(dummyIsoBlob, 'disk, cdrom');
});

document.getElementById('btn-iso').addEventListener('click', () => {
  document.getElementById('file-iso').click();
});

document.getElementById('file-iso').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) {
    boot(file, 'cdrom');
  }
});
</script>
</body>
</html>
